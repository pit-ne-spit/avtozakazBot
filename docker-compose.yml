version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: avtozakaz_db
    environment:
      POSTGRES_USER: ${DB_USER:-avtozakaz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: ${DB_NAME:-avtozakaz_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-avtozakaz}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: avtozakaz_bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-avtozakaz}:${DB_PASSWORD:-secure_password}@postgres:5432/${DB_NAME:-avtozakaz_bot}
      ENVIRONMENT: production
    volumes:
      - ./logs:/app/logs
      - ./bot.db:/app/bot.db  # Для разработки с SQLite
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
